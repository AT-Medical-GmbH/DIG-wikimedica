# =============================================================================
# Wikimedica — Central-Gateway Target (no local public Traefik)
# =============================================================================
# Use this variant INSTEAD OF docker-compose.yml when Wikimedica is fronted by
# the central ATINFRA reverse proxy / ingress (ATINFRA-gateway) rather than its
# own public Traefik. Running a second public Traefik next to the central
# gateway is explicitly NOT supported (see production-readiness-concept DEC-1).
#
# In this topology:
#   - TLS is terminated at the central gateway (Let's Encrypt / Cloudflare there).
#   - This stack exposes ONLY the MediaWiki HTTP port, bound by default to the
#     loopback interface, so the gateway (co-located, or via a private
#     tunnel/overlay network) forwards to it. MediaWiki is never bound to a
#     public interface directly.
#   - MariaDB stays on the internal-only network.
#
# Usage (app host):
#   docker compose \
#     -f infra/docker/docker-compose.gateway-target.yml \
#     --project-name wikimedica up -d
#
# 🧭 OWNER DECISION / 🔑 REAL VALUES (DEC-1): the exact bind address and the
#   gateway route (host port, private overlay network, or tunnel) depend on the
#   ATINFRA ingress design and must be set by DevOps — do not guess them.
#   Configure via APP_BIND (default 127.0.0.1) and APP_PORT (default 8080).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MediaWiki — application only; TLS handled upstream by the central gateway
  # ---------------------------------------------------------------------------
  mediawiki:
    image: mediawiki:1.43   # pin to a staging-verified digest in production
    container_name: wikimedica_app
    restart: unless-stopped
    env_file:
      - ../env/.env
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - mediawiki_images:/var/www/html/images
      - ../mediawiki/LocalSettings.php:/var/www/html/LocalSettings.php:ro
    networks:
      - internal_net
    # Expose ONLY to the configured bind address (loopback by default) so the
    # central gateway can reach it. Never bind to 0.0.0.0 in this topology.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$f=@fsockopen(\"127.0.0.1\",80);exit($$f?0:1);'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # MariaDB — internal only
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: wikimedica_db
    restart: unless-stopped
    env_file:
      - ../env/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MEDIAWIKI_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MEDIAWIKI_DB_NAME}
      MYSQL_USER: ${MEDIAWIKI_DB_USER}
      MYSQL_PASSWORD: ${MEDIAWIKI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal_net
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

# ---------------------------------------------------------------------------
# Named Volumes (shared with the standard production stack)
# ---------------------------------------------------------------------------
volumes:
  db_data:
    name: wikimedica_db_data
  mediawiki_images:
    name: wikimedica_images

# ---------------------------------------------------------------------------
# Networks — internal only; no public traefik_net in this topology
# ---------------------------------------------------------------------------
networks:
  internal_net:
    name: wikimedica_internal_net
    driver: bridge
    internal: true
