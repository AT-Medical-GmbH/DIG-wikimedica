# =============================================================================
# Wikimedica — Production Docker Compose
# =============================================================================
# Usage: docker compose -f infra/docker/docker-compose.yml up -d
# Requires: infra/env/.env (copy from infra/env/.env.example and fill in values)
#
# NOTE: The obsolete top-level `version:` key has been removed intentionally.
#       Docker Compose v2 ignores it and emits a deprecation warning.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Traefik — Reverse Proxy & TLS Termination
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: wikimedica_traefik
    restart: unless-stopped
    env_file:
      - ../env/.env
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      # Pass ACME email via CLI flag because Traefik static YAML does not expand ${VAR}.
      # TRAEFIK_ACME_EMAIL must be set in ../env/.env
      - "--certificatesresolvers.cloudflare-dns.acme.email=${TRAEFIK_ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/certs
    networks:
      - traefik_net
    labels:
      - "traefik.enable=false"  # Do not expose the Traefik dashboard publicly
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MediaWiki — Application
  # ---------------------------------------------------------------------------
  mediawiki:
    # MediaWiki 1.43 LTS — see docs/architecture/version-policy.md.
    # PRODUCTION: pin to an immutable digest verified on staging, e.g.
    #   image: mediawiki:1.43@sha256:<digest-from-staging>
    # The digest is intentionally NOT hard-coded here because it must be
    # captured from the registry during the staging-first rollout, not invented.
    image: mediawiki:1.43
    container_name: wikimedica_app
    restart: unless-stopped
    env_file:
      - ../env/.env
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - mediawiki_images:/var/www/html/images
      - ../mediawiki/LocalSettings.php:/var/www/html/LocalSettings.php:ro
    networks:
      - traefik_net
      - internal_net
    labels:
      # Enable Traefik routing
      - "traefik.enable=true"
      - "traefik.docker.network=wikimedica_traefik_net"
      # Router: HTTPS
      - "traefik.http.routers.mediawiki.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.mediawiki.entrypoints=websecure"
      - "traefik.http.routers.mediawiki.tls=true"
      - "traefik.http.routers.mediawiki.tls.certresolver=cloudflare-dns"
      - "traefik.http.routers.mediawiki.middlewares=security-headers@file"
      # Router: HTTP (redirect to HTTPS)
      - "traefik.http.routers.mediawiki-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.mediawiki-http.entrypoints=web"
      - "traefik.http.routers.mediawiki-http.middlewares=redirect-to-https@file"
      # Service
      - "traefik.http.services.mediawiki.loadbalancer.server.port=80"
    # The official mediawiki image is PHP+Apache and ships NO curl/wget, so a
    # curl-based healthcheck can never pass. Use the bundled PHP CLI to open a
    # TCP connection to the local Apache — a dependency-free liveness check.
    # (End-to-end HTTP health is verified externally by infra/deploy/deploy.sh.)
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$f=@fsockopen(\"127.0.0.1\",80);exit($$f?0:1);'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # MariaDB — Database
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: wikimedica_db
    restart: unless-stopped
    env_file:
      - ../env/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MEDIAWIKI_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MEDIAWIKI_DB_NAME}
      MYSQL_USER: ${MEDIAWIKI_DB_USER}
      MYSQL_PASSWORD: ${MEDIAWIKI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal_net
    # MariaDB should NOT be accessible from the traefik_net or the host in production
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis — Object Cache & Job Queue  [OPTIONAL — see version-policy DEC-3]
  # ---------------------------------------------------------------------------
  # Disabled by default. Enable together with the matching $wgObjectCaches /
  # $wgMainCacheType = CACHE_REDIS block in LocalSettings.php when the editorial
  # volume justifies it. Redis stays on the internal network only.
  #
  # redis:
  #   image: redis:7.4-alpine
  #   container_name: wikimedica_redis
  #   restart: unless-stopped
  #   command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - internal_net
  #   expose:
  #     - "6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 20s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  db_data:
    name: wikimedica_db_data
  mediawiki_images:
    name: wikimedica_images
  traefik_certs:
    name: wikimedica_certs
  # redis_data:                 # uncomment together with the redis service above
  #   name: wikimedica_redis_data

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  traefik_net:
    name: wikimedica_traefik_net
    driver: bridge
  internal_net:
    name: wikimedica_internal_net
    driver: bridge
    internal: true  # No external access; MariaDB only reachable from within
