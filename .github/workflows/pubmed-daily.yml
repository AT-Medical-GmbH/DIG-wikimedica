name: PubMed Daily Surveillance

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      days_back:
        description: "Number of days back to search"
        required: false
        default: "2"
      dry_run:
        description: "Dry run (do not create issues or commit)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: pubmed-daily
  cancel-in-progress: false

jobs:
  pubmed-search:
    name: Run PubMed daily surveillance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install biopython pyyaml requests

      - name: Announce the mode (API key present or reduced mode)
        env:
          HAS_KEY: ${{ secrets.NCBI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "PubMed surveillance runs with an NCBI API key (up to 10 requests/s)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::NCBI_API_KEY is not set. Running in reduced mode (3 requests/s, slower). Set the repository secret NCBI_API_KEY."
            echo "**Reduced mode:** no NCBI_API_KEY secret configured (3 requests/s). The run is valid but slower." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run PubMed daily search
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL || 'surveillance@wikimedica.de' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '2' }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/pubmed/pubmed-daily-search.py ${DRY_RUN_FLAG}

      - name: Commit PubMed output files
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Wikimedica Bot"
          git config user.email "bot@wikimedica.de"
          git add data/pubmed/
          if git diff --staged --quiet; then
            echo "No new PubMed data to commit."
          else
            DATE=$(date -u '+%Y-%m-%d')
            git commit -m "chore(pubmed): daily surveillance results ${DATE} [skip ci]"
            git push
          fi

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pubmed-error-log
          path: data/pubmed/error.log
          if-no-files-found: ignore
