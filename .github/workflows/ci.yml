name: CI

# Required checks for every pull request. The single job `ci-ok` aggregates all
# of them: make THAT job the only required status check in the branch protection.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and PHP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring, xml, sqlite3, pdo_sqlite
          tools: none
      - run: pip install -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest tests -v --tb=short

  content:
    name: Content validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.1
      - name: Validate article metadata (all content)
        run: python scripts/validation/validate-metadata.py content/ tests/fixtures
      - name: Validate the templates (structure)
        run: python scripts/validation/validate-metadata.py --templates content/templates
      - name: Check status transitions against the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/validation/check-status-transitions.py --base-ref "origin/${{ github.base_ref }}"
      - name: Publishing dry run (staging, no network)
        run: python scripts/publishing/import_to_mediawiki.py --env staging --dry-run --output-dir "$RUNNER_TEMP/import-dry-run"
      - name: Upload rendered wikitext
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-wikitext
          path: ${{ runner.temp }}/import-dry-run
          if-no-files-found: ignore
          retention-days: 7

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Docker Compose configuration (all variants)
        run: |
          cp infra/env/.env.example infra/env/.env
          docker compose -f infra/docker/docker-compose.yml config -q
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.override.yml config -q
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.staging.yml config -q
          docker compose -f infra/docker/docker-compose.gateway-target.yml config -q
          rm -f infra/env/.env
      - name: YAML lint
        run: yamllint -f github .github infra data/metadata data/registries data/legal scripts/pubmed .yamllint.yml
      - name: ShellCheck (deploy scripts)
        run: shellcheck infra/deploy/*.sh
      - name: GitHub Actions workflow lint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  docs:
    name: Markdown lint and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:md
      - run: npm run spell

  ci-ok:
    name: ci-ok
    if: always()
    needs: [tests, content, infra, docs]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed?
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::At least one required job did not succeed."
            exit 1
          fi
