name: Deploy

# Production deploys a RELEASE TAG (vX.Y.Z) that lies on main — nothing else.
# Pull requests and branches can never reach this workflow.
# Prerequisite: GitHub environment "production" with required reviewers.
# Required secrets (environment "production"): SSH_PRIVATE_KEY, SSH_HOST, SSH_USER,
# SSH_KNOWN_HOSTS, DEPLOY_PATH (checkout on the server), SSH_PORT (optional, default 22).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vX.Y.Z, must be on main)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: wikimedica-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release tag to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate the tag format
        run: |
          if ! [[ "${DEPLOY_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${DEPLOY_TAG}' is not a release tag (vX.Y.Z)"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.DEPLOY_TAG }}
          fetch-depth: 0

      - name: The tag must be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${DEPLOY_TAG} is not on main. Production deploys only reviewed, merged code."
            exit 1
          fi

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Deploy on the server (backup, update, health check, automatic rollback)
        id: deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -o pipefail
          result=unknown
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' && DEPLOY_ENV=production ./infra/deploy/deploy.sh --tag '${DEPLOY_TAG}'" \
            | tee deploy-output.txt || true
          result="$(grep -E '^DEPLOY_RESULT=' deploy-output.txt | tail -n1 | cut -d= -f2 || true)"
          echo "result=${result:-unknown}" >> "$GITHUB_OUTPUT"
          [ "${result}" = "success" ]

      - name: Fetch the deployment report
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "cat '${DEPLOY_PATH}/deploy-summary.md'" > deploy-summary.md 2>/dev/null \
            || echo "No deployment report available (server not reachable or deploy.sh did not start)." > deploy-summary.md
          cat deploy-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open an incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('deploy-summary.md') ? fs.readFileSync('deploy-summary.md', 'utf8') : '';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment ${process.env.DEPLOY_TAG} failed (${process.env.RESULT || 'unknown'})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n${report}\n\nFollow docs/operations/runbook.md (incident: failed deployment).`,
            });

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
