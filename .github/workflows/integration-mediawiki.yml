name: Integration (real MediaWiki)

# Boots a real MediaWiki 1.43 (tarball pinned by SHA-256) with SQLite and runs the
# role/permission model, the importer, the bootstrap and the Parsoid/VisualEditor
# checks against it. Slower and network-bound, so it is not part of the required
# `ci-ok` job; it runs weekly, on demand and whenever the pieces it covers change.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "infra/mediawiki/**"
      - "infra/deploy/bootstrap-wiki.sh"
      - "scripts/publishing/**"
      - "tests/integration/**"
      - "data/legal/**"
      - "data/metadata/**"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-mediawiki:
    name: MediaWiki 1.43 end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring, xml, sqlite3, pdo_sqlite, curl, fileinfo
          tools: none
      - run: pip install -r requirements-dev.txt
      - name: Cache the MediaWiki tarball
        uses: actions/cache@v4
        with:
          path: .cache/mediawiki
          key: mediawiki-1.43.11-86a5b8e2
      - name: Run the integration tests
        env:
          WM_REAL_MW: "1"
          WM_MW_CACHE: ${{ github.workspace }}/.cache/mediawiki
        run: python -m pytest tests/integration -v --tb=short
